<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Overview - Daymark</title>
    <meta name="description" content="Daymark - View your weekly productivity overview.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="app-container">
        <!-- Mobile Header -->
        <header class="mobile-header">
            <a href="index.html" class="mobile-brand" aria-label="Daymark home">
                <svg class="mobile-brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="6" width="24" height="4" rx="2" fill="currentColor"/>
                    <rect x="4" y="14" width="18" height="4" rx="2" fill="currentColor" opacity="0.7"/>
                    <rect x="4" y="22" width="12" height="4" rx="2" fill="currentColor" opacity="0.5"/>
                </svg>
                <span>Daymark</span>
            </a>
            <button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-expanded="false" aria-controls="sidebarNav" aria-label="Open navigation menu">
                <span class="mobile-menu-icon" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
                <span>Menu</span>
            </button>
        </header>
        
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebarNav" role="navigation" aria-label="Main navigation">
            <div class="brand">
                <a href="index.html" class="brand-link" aria-label="Daymark home">
                    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="6" width="24" height="4" rx="2" fill="currentColor"/>
                        <rect x="4" y="14" width="18" height="4" rx="2" fill="currentColor" opacity="0.7"/>
                        <rect x="4" y="22" width="12" height="4" rx="2" fill="currentColor" opacity="0.5"/>
                    </svg>
                    <span class="brand-name">Daymark</span>
                </a>
            </div>
            
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="tasks.html" class="nav-link">My Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a href="overview.html" class="nav-link" aria-current="page">Weekly Overview</a>
                    </li>
                    <li class="nav-item">
                        <a href="settings.html" class="nav-link">Settings</a>
                    </li>
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main id="main-content" class="main-content" role="main">
            <header class="page-header">
                <h1 class="page-title">Weekly Overview</h1>
                <p class="page-subtitle">Track your progress across the week.</p>
            </header>
            
            <section class="page-body overview-page">
                <div class="overview-period">
                    <span class="overview-period-badge">This week</span>
                    <p class="overview-period-range" id="overviewWeekRange"></p>
                </div>

                <div class="dashboard-notice overview-notice" id="overviewNotice" role="alert" hidden>
                    <p class="dashboard-notice-text" id="overviewNoticeText"></p>
                </div>

                <!-- Weekly summary -->
                <section class="overview-summary" aria-label="Weekly summary">
                    <article class="summary-card">
                        <div class="summary-card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <div class="summary-card-content">
                            <p class="summary-card-label">Completed this week</p>
                            <p class="summary-card-value" id="overviewCompleted">&mdash;</p>
                        </div>
                    </article>

                    <article class="summary-card">
                        <div class="summary-card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                        <div class="summary-card-content">
                            <p class="summary-card-label">Remaining this week</p>
                            <p class="summary-card-value" id="overviewRemaining">&mdash;</p>
                        </div>
                    </article>

                    <article class="summary-card">
                        <div class="summary-card-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="5" x2="5" y2="19"></line>
                                <circle cx="6.5" cy="6.5" r="2.5"></circle>
                                <circle cx="17.5" cy="17.5" r="2.5"></circle>
                            </svg>
                        </div>
                        <div class="summary-card-content">
                            <p class="summary-card-label">Completion rate</p>
                            <p class="summary-card-value" id="overviewRate">&mdash;</p>
                        </div>
                    </article>
                </section>

                <p class="overview-summary-note" id="overviewSummaryNote"></p>

                <!-- Daily completed-task breakdown -->
                <section class="card overview-breakdown" aria-labelledby="breakdownHeading">
                    <header class="card-header overview-card-header">
                        <div class="overview-card-heading">
                            <h2 class="card-title" id="breakdownHeading">Daily breakdown</h2>
                            <p class="overview-card-subtitle">Tasks completed Monday through Sunday</p>
                        </div>
                        <p class="overview-week-total" id="overviewWeekTotal">&mdash;</p>
                    </header>
                    <div class="card-body">
                        <ul class="overview-days" id="overviewDayList"></ul>
                        <p class="overview-empty" id="overviewDaysEmpty" hidden></p>
                        <p class="overview-note" id="overviewDaysNote" hidden></p>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <template id="overviewDayTemplate">
        <li class="overview-day">
            <div class="overview-day-label">
                <span class="overview-day-name"></span>
                <span class="overview-day-date"></span>
            </div>
            <div class="overview-day-track" aria-hidden="true">
                <span class="overview-day-bar"></span>
            </div>
            <span class="overview-day-count"></span>
        </li>
    </template>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/task-store.js"></script>
    <script src="js/overview.js"></script>
</body>
</html>
